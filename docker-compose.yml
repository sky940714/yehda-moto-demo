services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --innodb-buffer-pool-size=256M --max-connections=120 --wait-timeout=300 --interactive-timeout=300 --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      FACEBOOK_GRAPH_VERSION: ${FACEBOOK_GRAPH_VERSION:-v23.0}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_HASH_B64: ${ADMIN_PASSWORD_HASH_B64:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      APP_URL: ${APP_URL:-}
      ECPAY_ENV: ${ECPAY_ENV:-stage}
      ECPAY_MERCHANT_ID: ${ECPAY_MERCHANT_ID:-}
      ECPAY_HASH_KEY: ${ECPAY_HASH_KEY:-}
      ECPAY_HASH_IV: ${ECPAY_HASH_IV:-}
      ECPAY_RETURN_URL: ${ECPAY_RETURN_URL:-}
      ECPAY_ORDER_RESULT_URL: ${ECPAY_ORDER_RESULT_URL:-}
      ECPAY_LOGISTICS_ENV: ${ECPAY_LOGISTICS_ENV:-stage}
      ECPAY_LOGISTICS_MERCHANT_ID: ${ECPAY_LOGISTICS_MERCHANT_ID:-}
      ECPAY_LOGISTICS_HASH_KEY: ${ECPAY_LOGISTICS_HASH_KEY:-}
      ECPAY_LOGISTICS_HASH_IV: ${ECPAY_LOGISTICS_HASH_IV:-}
      ECPAY_LOGISTICS_SENDER_NAME: ${ECPAY_LOGISTICS_SENDER_NAME:-}
      ECPAY_LOGISTICS_SENDER_PHONE: ${ECPAY_LOGISTICS_SENDER_PHONE:-}
      ECPAY_LOGISTICS_SENDER_ZIP: ${ECPAY_LOGISTICS_SENDER_ZIP:-236}
      ECPAY_LOGISTICS_SENDER_ADDRESS: ${ECPAY_LOGISTICS_SENDER_ADDRESS:-}
      STORE_RETURN_ADDRESS: ${STORE_RETURN_ADDRESS:-}
      STORE_RETURN_RECIPIENT: ${STORE_RETURN_RECIPIENT:-}
      STORE_RETURN_PHONE: ${STORE_RETURN_PHONE:-}
      STORE_NOTIFICATION_EMAIL: ${STORE_NOTIFICATION_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
